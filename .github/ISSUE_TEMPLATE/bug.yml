name: Bug
description: Something is broken or behaving wrong.
labels: [bug]
body:
  - type: input
    id: summary
    attributes:
      label: One-line summary
      placeholder: e.g. Theme switcher flashes on /experience
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /experience
        2. Click ENTER SIMULATION
        3. Cycle theme
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      placeholder: |
        Expected: smooth crossfade.
        Actual: 200ms white flash.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome 130 on iOS Safari
    validations:
      required: false
