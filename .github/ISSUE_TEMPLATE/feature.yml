name: Feature / improvement
description: A new feature, polish pass, or design improvement.
labels: [feature]
body:
  - type: input
    id: title
    attributes:
      label: One-line summary
      placeholder: e.g. Add a TOC to /wc/papers
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - landing / boot
        - /experience (3D)
        - /wc (papers, learn, about)
        - /fmhy
        - /og (sketches)
        - theme system
        - infra (CI, deploy, scripts)
        - other
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why
      description: What pain or opportunity is this addressing.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Sketch of the change
      description: Files, components, or behavior. Specifics help future agents claim this.
    validations:
      required: false
