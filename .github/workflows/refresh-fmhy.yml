name: refresh-fmhy

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch FMHY snapshot
        run: npm run fetch:fmhy

      - name: Open PR if snapshot changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-fmhy
          delete-branch: true
          title: 'chore: refresh FMHY snapshot'
          commit-message: 'chore: refresh FMHY snapshot'
          body: |
            Automated weekly refresh of `src/app/fmhy/_data/`.

            If this PR is empty, the upstream catalog has not changed since the
            last snapshot.

            Review the diff to spot upstream renames, dead links, or category
            additions worth promoting in `categories.ts`.
          add-paths: |
            src/app/fmhy/_data/index.json
            src/app/fmhy/_data/categories/*.json
