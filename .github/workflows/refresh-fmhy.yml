name: refresh-fmhy

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch FMHY backup sites
        run: npm run fetch:fmhy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open PR if snapshot changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-fmhy
          delete-branch: true
          title: 'chore: refresh FMHY backup sites'
          commit-message: 'chore: refresh FMHY backup sites'
          body: |
            Automated weekly refresh of `src/app/fmhy/_data/backup-sites.json`.

            Pulls the backup/mirror site list from `docs/other/backups.md` on the FMHY
            edit repo. If this PR is empty, no backup sites changed since the last snapshot.
          add-paths: |
            src/app/fmhy/_data/backup-sites.json
