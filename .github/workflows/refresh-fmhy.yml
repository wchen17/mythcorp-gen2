name: refresh-fmhy

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch FMHY snapshot
        run: npm run fetch:fmhy

      - name: Push branch if snapshot changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add src/app/fmhy/_data/index.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged, nothing to push.'
            exit 0
          fi

          git checkout -B chore/refresh-fmhy
          git commit -m 'chore: refresh FMHY snapshot'
          git push --force origin chore/refresh-fmhy

          echo "Snapshot changed. Open a PR here:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...chore/refresh-fmhy?expand=1" >> "$GITHUB_STEP_SUMMARY"
